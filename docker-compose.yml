services:

    app:
        image: ghcr.io/everett78/dipalert:latest
        ports:
            - 8080:80
        volumes:
            - storage:/app/storage
            - backups:/backups
            - ./.env:/app/.env
        environment:
            DB_HOST: database                       # Name of the database service
            DB_USERNAME: dipalert                   # Should match MARIADB_USER in the database service
            DB_PASSWORD: dip4lert                   # Should match MARIADB_PASSWORD in the database service
            DB_DATABASE: dipalert                   # Should match MARIADB_DATABASE in the database service
            APP_USER_EMAIL: admin@example.com       # Only used for seeding the database
            APP_USER_PASSWORD: admin                # Only used for seeding the database
            APP_TIMEZONE: Europe/Warsaw
            APP_LOCALE: pl
            AFFILIATE_ENABLED: 'false'
            FLARESOLVERR_URL: http://flaresolverr:8191
            DIPALERT_ALLOWED_INTERNAL_HOSTS: flaresolverr
        depends_on:
            database:
                condition: service_healthy
        networks:
            - default

    database:
        image: mariadb:11
        environment:
            MARIADB_DATABASE: dipalert
            MARIADB_USER: dipalert
            MARIADB_PASSWORD: dip4lert
            MARIADB_ROOT_PASSWORD: root
        volumes:
            - database:/var/lib/mysql
        networks:
            - default
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 1m

    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        networks:
            - default

volumes:
    storage:
    database:
    backups:

networks:
    default:
